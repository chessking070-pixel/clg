<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .box1
        {
            border: 4px solid red;
            text-align: center;
            padding: 20px;
            margin: 100px;
            height: auto;
            width: 250px;
            box-shadow: 5px 5px 5px black;
            box-sizing: content-box;
        }
        .box2
        {
            text-align: center;
            border: 4px solid green;
            padding: 20px;
            margin: 100px;
            height: auto;
            width: 250px;
            box-shadow: 5px 5px 5px pink;
            box-sizing: border-box;
        }
        [type = "text"]
        {
                background-color: red;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lec-2 P1</title>
</head>
<body>
    <h1>How Are You ?</h1><input type="text" name="" id=""> <br>
    <div class="box1">Box sizing is content-box</div>
    <div class="box2">Box sizing is border-box</div>
</body>
</html>
