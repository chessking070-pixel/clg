<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        div
        {
            position: relative;
            height: 500px;
            width: 500px;
        }
        img
        {
            width: 500px;
            height: 500px;
            position:absolute;
            top: 5px;
            opacity: 0.8;
        }
        h1
        {
            position:absolute;
            top: 15px;
            left: 10px;
        }
        h2
        {
            position: absolute;
            bottom: 20px;
            right: 20px;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
    <img src="1.png" alt="">
    <h1>Top left</h1>
    <h2>Bottom Right</h2>
    </div>
</body>
</html>
