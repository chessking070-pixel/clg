<!-- Example of class and id selectors -->
 <html>
    <head>
        <style>
            div.c1 p
            {
                font-weight: bold;
                text-transform: uppercase;
                color: blueviolet;
            }
        </style>
    </head>
    <body>
        <div class="c1">
            <p>This is para with class</p>
        </div>
        <div>
            <p>para without class</p>
        </div>
    </body>
 </html>
