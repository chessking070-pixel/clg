<!-- Example of descendant selectors, kinda perfect -->

<html>
    <head>
        <style>
            ol li
            {
                color: red;
                font-style: italic;
                font-weight: bold;
            }
            ul li
            {
                color: blue;
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <ol>
            <li>ABC</li>
            <li>PQR</li>
            <li>MNC</li>
        </ol>
        <ul>
            <li>Mango</li>
            <li>Banana</li>
            <li>Orange</li>
        </ul>
    </body>
</html>
